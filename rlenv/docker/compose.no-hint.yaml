# Inspect sandbox for the no-hint starter (service must be named "default").
services:
  default:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent-cpu
      args:
        VARIANT: no-hint
    image: sc-rlenv-agent-cpu:no-hint
    init: true
    command: tail -f /dev/null
    working_dir: /workspace
    network_mode: none
    cpus: 4
    mem_limit: 8g
